services:
  db:
    image: postgres:16-alpine
    container_name: pr-poc-db
    environment:
      POSTGRES_DB: purchase_requisition_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purchase_requisition_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: pr-poc-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/purchase_requisition_db
      SECRET_KEY: poc-demo-secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: pr-poc-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
